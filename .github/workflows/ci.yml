name: CI

# Two modes (KAN-110):
# - Task PRs (base `stag` or any branch but `main`): run only what the diff
#   touches. Lint the changed files, run the unit tests related to them,
#   typecheck when code changed, e2e when the app or e2e files changed.
#   A docs-only PR runs nothing but `changes` and the `checks` gate.
# - Release PR (base `main`) and manual runs: the full suite once (all unit
#   tests, full lint, typecheck, build, e2e).
# Changes to this workflow, package.json or the lockfile also force the full
# suite, because the affected-only rules cannot see their impact.
#
# Only `pull_request` triggers the workflow, so a commit never runs twice
# (PR + push). Merges into `stag` are covered by the PR that was merged.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      code: ${{ steps.scope.outputs.code }}
      e2e: ${{ steps.scope.outputs.e2e }}
      lint_files: ${{ steps.scope.outputs.lint_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" = "main" ]; then
            echo "Full suite: event=$EVENT base=$BASE_REF"
            { echo "full=true"; echo "code=true"; echo "e2e=true"; echo "lint_files="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"

          full=false
          code=false
          e2e=false

          if echo "$changed" | grep -qE '^(\.github/workflows/ci\.yml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$'; then
            full=true
          fi
          if echo "$changed" | grep -qE '\.(ts|tsx|js|jsx|mjs|cjs)$|^(tsconfig\.json|next\.config\.ts|eslint\.config\.mjs|vitest\.config\.ts)$'; then
            code=true
          fi
          if echo "$changed" | grep -qE '^(app|components|constants|db|e2e|features|hooks|public|services|types|utils)/|^(proxy\.ts|instrumentation\.ts|next\.config\.ts|playwright\.config\.ts|postcss\.config\.mjs|tsconfig\.json)$'; then
            e2e=true
          fi
          if [ "$full" = "true" ]; then
            code=true
            e2e=true
          fi

          lint_files=$(echo "$changed" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' | tr '\n' ' ' || true)

          echo "full=$full code=$code e2e=$e2e"
          {
            echo "full=$full"
            echo "code=$code"
            echo "e2e=$e2e"
            echo "lint_files=$lint_files"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.changes.outputs.full }}
      LINT_FILES: ${{ needs.changes.outputs.lint_files }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `vitest --changed` diffs against the PR base commit.
          fetch-depth: 0

      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: |
          if [ "$FULL" = "true" ]; then
            pnpm test
          else
            # Tests whose module graph touches a changed file.
            pnpm exec vitest run --changed "$BASE_SHA" --passWithNoTests
          fi

      - name: Lint
        run: |
          if [ "$FULL" = "true" ]; then
            pnpm lint
          elif [ -n "${LINT_FILES// /}" ]; then
            # shellcheck disable=SC2086 # word splitting is intended
            pnpm exec eslint --max-warnings 0 --no-warn-ignored $LINT_FILES
          else
            echo "No lintable files changed."
          fi

      # tsc cannot check a subset of files with the project config, so any
      # code change typechecks the whole project.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        if: env.FULL == 'true'
        run: pnpm build

  # Playwright e2e on a throwaway SQLite file (e2e/.tmp). Not part of the
  # `checks` gate yet: keep it under 3 minutes or move it back to a local-only
  # command.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/.tmp/results
          retention-days: 7

  # The required status check. Always reports, so branch protection works when
  # `verify` is skipped; fails when a job it needs failed or was cancelled.
  checks:
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "changes=$CHANGES verify=$VERIFY"
          if [ "$CHANGES" != "success" ]; then
            exit 1
          fi
          if [ "$VERIFY" != "success" ] && [ "$VERIFY" != "skipped" ]; then
            exit 1
          fi
